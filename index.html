<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>IDAS</title>
    <style>
      :root {
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        /* The orthographic camera renders 50px per world unit, so the symbol is a
           fixed ~140px radius at the viewport centre no matter the window size. */
        --symbol-radius: 140px;
        --stack-gap: clamp(48px, 12vh, 90px);
        --accent: #E50000;
      }

      body { margin: 0; }

      /* The three.js renderer appends its canvas straight to <body>. */
      canvas { display: block; }

      .marquee {
        position: fixed;
        /* sit one gap above the symbol, not a fraction of the viewport */
        bottom: calc(50% + var(--symbol-radius) + var(--stack-gap));
        left: 0;
        width: 100%;
        z-index: 1;
        margin: 0;
        overflow: hidden;
        font-family: var(--mono);
        font-size: clamp(13px, 2.1vw, 22px);
        font-weight: 400;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #000;
        /* soften the edges so the text enters and leaves rather than clipping */
        mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      }

      .marquee__track {
        display: inline-flex;
        white-space: nowrap;
        will-change: transform;
        animation: marquee-scroll 45s linear infinite;
      }

      .marquee__item { padding-right: 3em; }

      @keyframes marquee-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }

      .signup {
        position: fixed;
        left: 50%;
        /* mirrors the ticker's gap; the min() keeps it on screen in short windows */
        top: min(
          calc(50% + var(--symbol-radius) + var(--stack-gap)),
          calc(100% - 120px)
        );
        transform: translateX(-50%);
        width: min(420px, calc(100vw - 48px));
        z-index: 1;
        font-family: var(--mono);
        color: #000;
      }

      .signup__note {
        /* inline-block so the hover target is the text, not the full column width */
        display: inline-block;
        position: relative;
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.5;
        letter-spacing: 0.14em;
        text-transform: none;
      }

      /* Glitch: two offset copies of the text, sliced into bands and jittered.
         Pointer devices only — there is no hover state to leave on touch. */
      @media (hover: hover) {
        .signup__note::before,
        .signup__note::after {
          content: attr(data-text);
          position: absolute;
          inset: 0;
          opacity: 0;
          pointer-events: none;
        }

        .signup__note::before { color: var(--accent); }
        .signup__note::after  { color: #000; }

        .signup__note:hover {
          animation: glitch-shake 200ms steps(1, end) infinite;
        }

        .signup__note:hover::before {
          opacity: 1;
          animation: glitch-slice-a 700ms steps(1, end) infinite;
        }

        .signup__note:hover::after {
          opacity: 1;
          animation: glitch-slice-b 900ms steps(1, end) infinite;
        }
      }

      @keyframes glitch-shake {
        0%   { transform: translate(0, 0); }
        25%  { transform: translate(1px, -1px); }
        50%  { transform: translate(-1px, 1px); }
        75%  { transform: translate(1px, 1px); }
        100% { transform: translate(0, 0); }
      }

      /* inset() crops each copy to a horizontal band; the band jumps every step */
      @keyframes glitch-slice-a {
        0%   { clip-path: inset(0 0 82% 0);   transform: translate(-3px, -1px); }
        16%  { clip-path: inset(44% 0 38% 0); transform: translate(3px, 1px); }
        32%  { clip-path: inset(68% 0 12% 0); transform: translate(-2px, 0); }
        48%  { clip-path: inset(18% 0 64% 0); transform: translate(4px, -1px); }
        64%  { clip-path: inset(88% 0 2% 0);  transform: translate(-4px, 1px); }
        80%  { clip-path: inset(34% 0 52% 0); transform: translate(2px, 0); }
        100% { clip-path: inset(6% 0 76% 0);  transform: translate(-3px, 1px); }
      }

      @keyframes glitch-slice-b {
        0%   { clip-path: inset(52% 0 30% 0); transform: translate(3px, 1px); }
        18%  { clip-path: inset(10% 0 74% 0); transform: translate(-4px, 0); }
        36%  { clip-path: inset(78% 0 8% 0);  transform: translate(2px, -1px); }
        54%  { clip-path: inset(30% 0 56% 0); transform: translate(-3px, 1px); }
        72%  { clip-path: inset(62% 0 22% 0); transform: translate(4px, 0); }
        88%  { clip-path: inset(2% 0 88% 0);  transform: translate(-2px, -1px); }
        100% { clip-path: inset(46% 0 40% 0); transform: translate(3px, 1px); }
      }

      .signup__form {
        display: flex;
        align-items: stretch;
        gap: 8px;
      }

      /* display:flex would otherwise beat the UA rule for [hidden] */
      .signup__form[hidden] { display: none; }

      .signup__input {
        flex: 1 1 auto;
        min-width: 0;
        appearance: none;
        border: 0;
        border-bottom: 2px solid #000;
        border-radius: 0;
        background: transparent;
        padding: 8px 2px;
        font: inherit;
        font-size: 16px;
        color: #000;
      }

      .signup__input::placeholder { color: #999; }

      .signup__button {
        flex: 0 0 auto;
        border: 3px solid #000;
        border-radius: 0;
        background: #000;
        color: #fff;
        padding: 8px 16px;
        font: inherit;
        font-size: 14px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 120ms linear, color 120ms linear;
      }

      .signup__button:hover:not(:disabled) { background: var(--accent); color: #000; }
      .signup__button:disabled { opacity: 0.4; cursor: default; }

      .signup__input:focus-visible,
      .signup__button:focus-visible {
        outline: 2px solid #000;
        outline-offset: 3px;
      }

      .signup__status {
        margin: 10px 0 0;
        min-height: 1.5em;
        font-size: 11px;
        line-height: 1.5;
        letter-spacing: 0.08em;
      }

      .signup__status[data-state="error"] { color: #b00020; }

      .visually-hidden {
        position: absolute;
        width: 1px; height: 1px;
        margin: -1px; padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        .signup__button { transition: none; }
        .marquee__track { animation: none; }

        .signup__note:hover,
        .signup__note:hover::before,
        .signup__note:hover::after {
          animation: none;
        }
        /* keep a static chromatic split so the hover still registers */
        .signup__note:hover::before {
          opacity: 1;
          clip-path: none;
          transform: translate(-2px, 0);
        }
        .signup__note:hover::after {
          opacity: 1;
          clip-path: none;
          transform: translate(2px, 0);
        }
      }

      @media (max-width: 420px) {
        .signup__form { flex-direction: column; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CJkFYKXJ.js"></script>
  </head>
  <body>
    <div id="app"></div>

    <h1 class="marquee" aria-label="Institute for the Design of Alternative Systems">
      <span class="marquee__track" aria-hidden="true">
        <span class="marquee__item">Institute for the Design of Alternative Systems</span>
        <span class="marquee__item">Institute for the Design of Alternative Systems</span>
        <span class="marquee__item">Institute for the Design of Alternative Systems</span>
        <span class="marquee__item">Institute for the Design of Alternative Systems</span>
      </span>
    </h1>

    <div class="signup">
      <p class="signup__note" data-text="Subscribe for IDAS News + Events">Subscribe for IDAS News + Events</p>
      <form class="signup__form" id="signup-form" novalidate>
        <label class="visually-hidden" for="signup-email">Email address</label>
        <input
          class="signup__input"
          id="signup-email"
          type="email"
          name="email"
          placeholder="[...]@[...].[...]" 
          autocomplete="email"
          spellcheck="false"
          required
        />
        <button class="signup__button" id="signup-button" type="submit">Join</button>
      </form>
      <p class="signup__status" id="signup-status" role="status" aria-live="polite"></p>
    </div>

    <script>

      const SIGNUP_ENDPOINT = "https://formsubmit.co/ajax/7f38490dd81ad5d4639ce0f92aca1d43";;

      (function () {
        const form = document.getElementById("signup-form");
        const input = document.getElementById("signup-email");
        const button = document.getElementById("signup-button");
        const status = document.getElementById("signup-status");

        function setStatus(message, state) {
          status.textContent = message;
          status.dataset.state = state || "";
        }

        function isValidEmail(value) {
          return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
        }

        form.addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = input.value.trim();

          if (!isValidEmail(email)) {
            setStatus("Enter a valid email address.", "error");
            input.focus();
            return;
          }

          if (!SIGNUP_ENDPOINT) {
            console.error("SIGNUP_ENDPOINT is empty — set it in index.html.");
            setStatus("Signup isn't connected yet.", "error");
            return;
          }

          button.disabled = true;
          setStatus("Sending…", "pending");

          try {
            const response = await fetch(SIGNUP_ENDPOINT, {
              method: "POST",
              headers: { "Content-Type": "application/json", 
                          "Accept": "application/json" },
              body: JSON.stringify({ email: email })
            });

            if (!response.ok) throw new Error("Request failed: " + response.status);

            form.hidden = true;
            setStatus("You've been added to the list :)", "success");
          } catch (error) {
            console.error(error);
            setStatus("Something went wrong. Try again.", "error");
            button.disabled = false;
          }
        });

        input.addEventListener("input", function () {
          if (status.dataset.state === "error") setStatus("", "");
        });
      })();
    </script>

  </body>
</html>
